<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="robots" content="index, follow" />

  <!-- Font preconnect & load -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- SEO -->
  <title>Won Music – Nền Tảng Âm Nhạc Hàng Đầu Việt Nam</title>
  <meta name="description"
    content="Won Music là nền tảng âm nhạc đa nền tảng, cung cấp dịch vụ nghe nhạc trực tuyến, phát hành bản quyền, sản xuất và phân phối âm nhạc tại Việt Nam." />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.wonmusic.vn/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Won Music – Nền Tảng Âm Nhạc Số 1 Việt Nam" />
  <meta property="og:description"
    content="Nghe nhạc không giới hạn, khám phá nghệ sĩ và bản nhạc mới nhất. Won Music – mang âm nhạc đến mọi người." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.wonmusic.vn/" />
  <meta property="og:site_name" content="Won Music" />
  <meta property="og:image" content="https://www.wonmusic.vn/og-image.jpg" />
  <meta property="og:image:alt" content="Won Music – Nền Tảng Âm Nhạc Hàng Đầu Việt Nam" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Won Music – Âm Nhạc Không Giới Hạn" />
  <meta name="twitter:description"
    content="Khám phá âm nhạc, nghe nhạc trực tuyến và theo dõi nghệ sĩ yêu thích trên Won Music." />
  <meta name="twitter:image" content="https://www.wonmusic.vn/og-image.jpg" />

  <!-- Schema Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Won Music",
    "url": "https://www.wonmusic.vn/",
    "logo": "https://www.wonmusic.vn/logo.png",
    "description": "Nền tảng âm nhạc trực tuyến hàng đầu Việt Nam – nghe nhạc, phát hành và quản lý bản quyền âm nhạc.",
    "sameAs": [
      "https://www.facebook.com/wonmusic",
      "https://www.youtube.com/wonmusic",
      "https://www.tiktok.com/@wonmusic",
      "https://open.spotify.com/",
      "https://soundcloud.com/"
    ]
  }
  </script>

  <!-- Schema WebSite with SearchAction -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Won Music",
    "url": "https://www.wonmusic.vn/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://www.wonmusic.vn/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
